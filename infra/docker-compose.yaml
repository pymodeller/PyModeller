services:
  ministack:
    image: ministackorg/ministack:1.3-full
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - pymodeller-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - pymodeller-network

networks:
  pymodeller-network:
    driver: bridge